<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자리배치 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #2f4f46;
    --board-dark: #223a34;
    --chalk: #f4efe1;
    --wood: #b9895b;
    --wood-dark: #93693f;
    --paper: #fbf7ee;
    --paper-line: #e4dcc8;
    --window: #6fa3c4;
    --window-soft: #e4eff5;
    --corridor: #a8917a;
    --corridor-soft: #efe9df;
    --ink: #2c2a24;
    --ink-soft: #6b6558;
    --warn: #b8493a;
    --warn-soft: #f7e6e2;
    --ok: #4c7a5a;
    --ok-soft: #e6f0e7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans KR', sans-serif;
    background: var(--paper);
    color: var(--ink);
  }
  .app-header{
    background: var(--board);
    background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 4px 4px;
    color: var(--chalk);
    padding: 28px 32px 24px;
    border-bottom: 6px solid var(--wood);
  }
  .app-header h1{
    font-family:'Gaegu', sans-serif;
    font-weight:700;
    font-size: 2.1rem;
    margin: 0 0 4px;
    letter-spacing: 0.5px;
  }
  .app-header p{
    margin:0;
    font-size:0.92rem;
    color: #cfe0d8;
  }
  .layout{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    align-items: start;
    min-height: calc(100vh - 96px);
  }
  @media (max-width: 880px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* ---- Left panel ---- */
  .panel{
    padding: 24px;
    border-right: 1px solid var(--paper-line);
  }
  .panel h2{
    font-family:'Gaegu', sans-serif;
    font-size:1.2rem;
    margin: 0 0 12px;
    color: var(--board);
  }
  .card{
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 18px;
  }
  .row-inline{
    display:flex;
    gap:8px;
    margin-bottom:8px;
  }
  input[type=text], select{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 0.88rem;
    padding: 8px 10px;
    border: 1px solid #d8d0ba;
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
  }
  input[type=text]{ flex:1; min-width:0; }
  textarea{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    padding: 8px 10px;
    border: 1px solid #d8d0ba;
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
    width: 100%;
    min-height: 90px;
    resize: vertical;
  }
  button{
    font-family:'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    border: none;
    border-radius: 7px;
    padding: 9px 14px;
    cursor: pointer;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active{ transform: scale(0.97); }
  .btn-primary{ background: var(--board); color: var(--chalk); }
  .btn-primary:hover{ background: var(--board-dark); }
  .btn-wood{ background: var(--wood); color: #fff; }
  .btn-wood:hover{ background: var(--wood-dark); }
  .btn-ghost{ background: var(--paper); color: var(--ink); border:1px solid #d8d0ba; }
  .btn-ghost:hover{ background: #f1ead9; }
  .btn-small{ padding: 5px 9px; font-size: 0.75rem; }

  .student-list{
    max-height: 260px;
    overflow-y: auto;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .student-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 6px 8px;
    border-radius: 7px;
    background: var(--paper);
    font-size: 0.85rem;
  }
  .student-row .name{ flex:1; font-weight:500; }
  .pref-select{
    font-size: 0.72rem;
    padding: 4px 6px;
    border-radius: 20px;
    border: 1px solid #d8d0ba;
    background: #fff;
    color: var(--ink-soft);
  }
  .tag{
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
  }
  .tag-front{ background: var(--window-soft); color: #2c5e7a; }
  .tag-back{ background: var(--corridor-soft); color: #7a5a35; }
  .tag-none{ display:none; }
  .x-btn{
    border:none; background:transparent; color:#a99; cursor:pointer; font-size:0.9rem; padding:2px 4px;
  }
  .x-btn:hover{ color: var(--warn); }

  .pair-item{
    display:flex; align-items:center; gap:8px;
    font-size:0.83rem;
    padding: 5px 8px;
    background: var(--warn-soft);
    border-radius: 7px;
    margin-bottom:6px;
  }
  .pair-item span{ flex:1; }
  .empty-note{ font-size:0.8rem; color: var(--ink-soft); padding: 4px 2px; }
  .count-note{ font-size:0.78rem; color: var(--ink-soft); margin-top:6px; }

  /* ---- Right panel: seating ---- */
  .stage{
    padding: 24px 32px 40px;
  }
  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom: 20px;
  }
  .banner{
    font-size:0.85rem;
    font-weight:500;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
  }
  .banner-ok{ background: var(--ok-soft); color: var(--ok); }
  .banner-warn{ background: var(--warn-soft); color: var(--warn); }

  .room{
    max-width: 780px;
    margin: 0 auto;
  }
  .podium{
    background: var(--wood);
    color: #fff;
    font-family:'Gaegu', sans-serif;
    font-size: 1rem;
    text-align:center;
    padding: 10px;
    border-radius: 8px;
    letter-spacing: 2px;
  }
  .grid-wrap{
    display:flex;
    align-items:stretch;
    gap: 10px;
    margin: 10px 0;
  }
  .side-label{
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family:'Gaegu', sans-serif;
    font-size: 0.95rem;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius: 8px;
    padding: 6px 4px;
    min-width: 30px;
  }
  .side-window{ background: var(--window-soft); color:#2c5e7a; }
  .side-corridor{ background: var(--corridor-soft); color:#7a5a35; }

  .seat-grid{
    flex:1;
    display:grid;
    grid-template-rows: repeat(4, 1fr);
    gap: 14px;
    background: var(--paper);
    border: 1px dashed var(--paper-line);
    border-radius: 10px;
    padding: 14px;
  }
  .seat-row{
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .pair-group{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: #fff;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    padding: 4px;
  }
  .seat{
    background: var(--paper);
    border-radius: 6px;
    min-height: 52px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 4px;
    cursor: pointer;
    border: 2px solid transparent;
    word-break: keep-all;
  }
  .seat.empty{ color:#c9c0a8; font-weight:400; font-size:0.72rem; cursor:default; }
  .seat-id{ font-size:0.68rem; font-weight:400; color: var(--ink-soft); }
  .seat.selected{ border-color: var(--board); background: #dfeae4; }
  .seat.conflict{ background: var(--warn-soft); color: var(--warn); }

  .legend{
    display:flex; gap:14px; flex-wrap:wrap;
    font-size:0.75rem; color: var(--ink-soft);
    margin-top: 14px;
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:9px; height:9px; border-radius:2px; display:inline-block; }

  @media print{
    @page{ size: landscape; }
    .panel, .controls, .legend, .app-header, #bannerArea{ display:none !important; }
    .layout{ grid-template-columns: 1fr; }
    body{ background:#fff; }
    .seat.conflict{ background: var(--paper); color: var(--ink); }
    .print-only{ display:block !important; }
    .room{ max-width: 560px; margin: 40px auto 0; }
    .stage{ padding: 18px 24px; }
  }
  .print-only{ display:none; }
  .room-print-wrap{
    display:flex;
    gap: 28px;
    align-items:flex-start;
    justify-content:center;
  }

  .pw-overlay{
    position: fixed;
    inset: 0;
    background: rgba(44,42,36,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 1000;
  }
  .pw-box{
    background:#fff;
    border-radius: 10px;
    padding: 22px;
    width: 260px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .pw-title{
    font-family:'Gaegu', sans-serif;
    font-size: 1.05rem;
    color: var(--board);
    margin-bottom: 10px;
  }
  .pw-box input[type=password]{
    width:100%;
    font-family:'Noto Sans KR', sans-serif;
    font-size: 0.88rem;
    padding: 9px 10px;
    border: 1px solid #d8d0ba;
    border-radius: 7px;
    background: var(--paper);
    color: var(--ink);
  }
  .pw-error{
    color: var(--warn);
    font-size: 0.78rem;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="app-header">
  <h1>자리배치 도우미</h1>
  <p>32명 · 4줄 4열 · 2인 짝 배치</p>
</div>

<div class="layout">
  <div class="panel">
    <h2>학생 명단</h2>
    <div class="card">
      <div class="row-inline">
        <input type="text" id="nameInput" placeholder="학생 이름" maxlength="10">
        <select id="prefInput">
          <option value="none">선호 없음</option>
          <option value="front">앞자리 선호</option>
          <option value="back">뒷자리 선호</option>
        </select>
      </div>
      <button class="btn-primary" style="width:100%" onclick="addStudent()">+ 학생 추가</button>
      <div class="count-note" id="countNote"></div>
    </div>

    <div class="card">
      <div style="font-size:0.82rem; font-weight:700; margin-bottom:6px; color:var(--board);">한 번에 추가하기</div>
      <textarea id="bulkInput" placeholder="이름을 한 줄에 한 명씩 붙여넣으세요 (최대 32명, 쉼표로 구분해도 됩니다)"></textarea>
      <div class="row-inline" style="margin-top:8px;">
        <button class="btn-primary" style="flex:1" onclick="bulkAddStudents()">📋 목록 일괄 추가</button>
        <button class="btn-ghost" style="flex:1" onclick="fillNumbered()">🔢 1~32번 채우기</button>
      </div>
    </div>

    <div class="card">
      <div class="student-list" id="studentList"></div>
    </div>

    <h2>짝 기피 설정</h2>
    <button class="btn-ghost" style="width:100%; margin-bottom:12px;" onclick="toggleForbiddenPanel()" id="forbidToggleBtn">🔒 눌러서 확인하기 (교사 전용)</button>
    <div class="card" id="forbiddenPanel" style="display:none;">
      <div class="row-inline">
        <select id="forbid1"></select>
        <select id="forbid2"></select>
      </div>
      <button class="btn-ghost" style="width:100%" onclick="addForbiddenPair()">🚫 이 두 학생 짝 금지</button>
      <div id="forbiddenList" style="margin-top:10px;"></div>
    </div>
  </div>

  <div class="stage">
    <div class="controls">
      <button class="btn-primary" onclick="randomizeSeats()">🎲 무작위 자리 배치</button>
      <button class="btn-wood" onclick="toggleMode()" id="modeBtn">🖥 학생 이동용 화면 보기</button>
      <button class="btn-ghost" onclick="printChart()">🖨 교탁용 자리표 인쇄</button>
    </div>

    <div id="bannerArea"></div>

    <div class="room">
      <div id="podiumTop" class="podium">교 탁</div>
      <div class="grid-wrap">
        <div class="side-label" id="leftLabel"></div>
        <div class="seat-grid" id="seatGrid"></div>
        <div class="side-label" id="rightLabel"></div>
      </div>
      <div id="podiumBottom" class="podium" style="display:none;">교 탁</div>
    </div>

    <div class="legend">
      <span><span class="dot" style="background:var(--warn)"></span>기피 조건이 충돌한 자리</span>
      <span>💡 자리 두 곳을 순서대로 클릭하면 서로 자리를 바꿀 수 있어요</span>
    </div>
  </div>
</div>

<div id="pwOverlay" class="pw-overlay" style="display:none;">
  <div class="pw-box">
    <div class="pw-title">교사 비밀번호 확인</div>
    <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요">
    <div class="pw-error" id="pwError" style="display:none;">비밀번호가 올바르지 않습니다.</div>
    <div class="row-inline" style="margin-top:10px;">
      <button class="btn-ghost" style="flex:1" onclick="closePwModal()">취소</button>
      <button class="btn-primary" style="flex:1" onclick="submitPwModal()">확인</button>
    </div>
  </div>
</div>

<script>
// ---------- state ----------
// ---------- preset roster (auto-loaded) ----------
const INITIAL_ROSTER = [
  [10501,'강수혁'],[10502,'권정후'],[10503,'김남경'],[10504,'김세은'],
  [10505,'김연주'],[10506,'김정화'],[10507,'김지담'],[10508,'남윤성'],
  [10509,'남윤호'],[10510,'박건우'],[10511,'박성주'],[10512,'박시연'],
  [10513,'박시우'],[10514,'방서정'],[10515,'배소은'],[10516,'백경인'],
  [10517,'봉은솔'],[10518,'서성원'],[10519,'심준표'],[10520,'안서윤'],
  [10521,'안시연'],[10522,'우동현'],[10523,'우아인'],[10524,'유시우'],
  [10525,'이아영'],[10526,'이영은'],[10527,'이은호'],[10528,'이주호'],
  [10529,'이희원'],[10530,'정인아'],[10531,'조예담'],[10532,'홍준우']
];

// ---------- hidden internal placement rules (never surfaced in any UI) ----------
// fixed corner seat: front-most row, corridor-side column -> row 0, col 7
const FIXED_SEAT_STUDENT_ID = 10523;
const FIXED_SEAT = [0,7];
const NEAR_FIXED_SEAT = [[0,6],[1,7],[1,6]]; // partner seat + directly behind + diagonal
const KEEP_AWAY_IDS = [10501, 10511, 10513, 10506, 10524, 10514];

let students = INITIAL_ROSTER.map(([id,name]) => ({ id, name, pref: 'none' }));
let forbiddenPairs = []; // [id1, id2]
let seats = Array.from({length:4}, () => Array(8).fill(null)); // seats[row][col] = studentId, row0 = nearest podium, col0 = window side
let mode = 'screen';     // 'screen' | 'print'
let selectedSeat = null; // {row, col}
let nextId = 10533;

// ---------- student management ----------
function addStudent(){
  const nameInput = document.getElementById('nameInput');
  const prefInput = document.getElementById('prefInput');
  const name = nameInput.value.trim();
  if(!name){ return; }
  if(students.length >= 32){ alert('최대 32명까지 등록할 수 있어요.'); return; }
  students.push({ id: nextId++, name, pref: prefInput.value });
  nameInput.value = '';
  prefInput.value = 'none';
  nameInput.focus();
  renderStudentList();
  renderForbiddenSelects();
}

function bulkAddStudents(){
  const textarea = document.getElementById('bulkInput');
  const raw = textarea.value.trim();
  if(!raw){ return; }
  const names = raw
    .split(/[\n,]/)
    .map(n => n.trim())
    .filter(n => n.length > 0);

  if(names.length === 0){ return; }

  const room = 32 - students.length;
  if(room <= 0){
    alert('이미 32명이 모두 등록되어 있어요.');
    return;
  }
  const toAdd = names.slice(0, room);
  toAdd.forEach(name => {
    students.push({ id: nextId++, name, pref: 'none' });
  });

  if(names.length > toAdd.length){
    alert(`32명 정원을 넘어서 ${toAdd.length}명만 추가되고 나머지 ${names.length - toAdd.length}명은 추가되지 않았어요.`);
  }

  textarea.value = '';
  renderStudentList();
  renderForbiddenSelects();
}

function fillNumbered(){
  const room = 32 - students.length;
  if(room <= 0){
    alert('이미 32명이 모두 등록되어 있어요.');
    return;
  }
  const start = students.length + 1;
  for(let n = start; n <= 32; n++){
    students.push({ id: nextId++, name: `${n}번`, pref: 'none' });
  }
  renderStudentList();
  renderForbiddenSelects();
}

function removeStudent(id){
  students = students.filter(s => s.id !== id);
  forbiddenPairs = forbiddenPairs.filter(p => p[0] !== id && p[1] !== id);
  // clear from seats too
  for(let r=0;r<4;r++) for(let c=0;c<8;c++) if(seats[r][c]===id) seats[r][c]=null;
  renderStudentList();
  renderForbiddenSelects();
  renderForbiddenList();
  renderSeatGrid();
}

function updateStudentPref(id, pref){
  const student = students.find(s => s.id === id);
  if(student){ student.pref = pref; }
}

function renderStudentList(){
  const list = document.getElementById('studentList');
  if(students.length === 0){
    list.innerHTML = '<div class="empty-note">등록된 학생이 없습니다. 이름을 입력해 추가해 주세요.</div>';
  } else {
    const sorted = students.slice().sort((a,b) => a.id - b.id);
    list.innerHTML = sorted.map(s => `
      <div class="student-row">
        <span class="name">${s.id} ${escapeHtml(s.name)}</span>
        <select class="pref-select" onchange="updateStudentPref(${s.id}, this.value)">
          <option value="none" ${s.pref==='none'?'selected':''}>선호 없음</option>
          <option value="front" ${s.pref==='front'?'selected':''}>앞자리 선호</option>
          <option value="back" ${s.pref==='back'?'selected':''}>뒷자리 선호</option>
        </select>
        <button class="x-btn" onclick="removeStudent(${s.id})">✕</button>
      </div>
    `).join('');
  }
  document.getElementById('countNote').textContent = `현재 ${students.length}명 등록됨 (총 32자리)`;
}

function renderForbiddenSelects(){
  const opts = students.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
  document.getElementById('forbid1').innerHTML = opts || '<option value="">학생 없음</option>';
  document.getElementById('forbid2').innerHTML = opts || '<option value="">학생 없음</option>';
}

const FORBID_PASSWORD = '1234';

function toggleForbiddenPanel(){
  const panel = document.getElementById('forbiddenPanel');
  const isHidden = panel.style.display === 'none';

  if(isHidden){
    openPwModal();
  } else {
    panel.style.display = 'none';
    document.getElementById('forbidToggleBtn').textContent = '🔒 눌러서 확인하기 (교사 전용)';
  }
}

function openPwModal(){
  const overlay = document.getElementById('pwOverlay');
  const input = document.getElementById('pwInput');
  document.getElementById('pwError').style.display = 'none';
  input.value = '';
  overlay.style.display = 'flex';
  setTimeout(() => input.focus(), 0);
  input.onkeydown = (e) => { if(e.key === 'Enter'){ submitPwModal(); } };
}

function closePwModal(){
  document.getElementById('pwOverlay').style.display = 'none';
}

function submitPwModal(){
  const input = document.getElementById('pwInput');
  if(input.value === FORBID_PASSWORD){
    closePwModal();
    document.getElementById('forbiddenPanel').style.display = 'block';
    document.getElementById('forbidToggleBtn').textContent = '🔒 숨기기';
  } else {
    document.getElementById('pwError').style.display = 'block';
    input.value = '';
    input.focus();
  }
}

function addForbiddenPair(){
  const id1 = parseInt(document.getElementById('forbid1').value);
  const id2 = parseInt(document.getElementById('forbid2').value);
  if(!id1 || !id2 || id1 === id2){ alert('서로 다른 두 학생을 선택해 주세요.'); return; }
  const exists = forbiddenPairs.some(p => (p[0]===id1&&p[1]===id2) || (p[0]===id2&&p[1]===id1));
  if(exists){ return; }
  forbiddenPairs.push([id1, id2]);
  renderForbiddenList();
}

function removeForbiddenPair(index){
  forbiddenPairs.splice(index, 1);
  renderForbiddenList();
  renderSeatGrid();
}

function renderForbiddenList(){
  const el = document.getElementById('forbiddenList');
  if(forbiddenPairs.length === 0){
    el.innerHTML = '<div class="empty-note">설정된 기피 짝이 없습니다.</div>';
    return;
  }
  el.innerHTML = forbiddenPairs.map((p, i) => {
    const n1 = students.find(s=>s.id===p[0]);
    const n2 = students.find(s=>s.id===p[1]);
    const label = (n1 && n2) ? `${n1.name} ↔ ${n2.name}` : '(삭제된 학생 포함)';
    return `<div class="pair-item"><span>${escapeHtml(label)}</span><button class="x-btn" onclick="removeForbiddenPair(${i})">✕</button></div>`;
  }).join('');
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- seating algorithm ----------
// logical layout: row 0..3 (0 = closest to podium), col 0..7 (0 = window side)
// front rows = row 0,1 (16 seats) | middle = row 2 (8 seats) | back row = row 3 (8 seats)
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pairGroupsForRow(){
  return [[0,1],[2,3],[4,5],[6,7]];
}

function countConflicts(grid){
  let n = 0;
  for(let r=0;r<4;r++){
    for(const [c1,c2] of pairGroupsForRow()){
      const a = grid[r][c1], b = grid[r][c2];
      if(a && b && forbiddenPairs.some(p => (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a))) n++;
    }
  }
  // hidden proximity rule (never shown in any UI)
  NEAR_FIXED_SEAT.forEach(([r,c]) => {
    const occ = grid[r][c];
    if(occ && KEEP_AWAY_IDS.includes(occ)) n++;
  });
  return n;
}

function buildAttempt(){
  const frontSeats = []; for(let c=0;c<8;c++){ frontSeats.push([0,c]); frontSeats.push([1,c]); }
  const midSeats = []; for(let c=0;c<8;c++) midSeats.push([2,c]);
  const backSeats = []; for(let c=0;c<8;c++) backSeats.push([3,c]);

  const grid = Array.from({length:4}, () => Array(8).fill(null));

  // hidden rule: reserve the fixed corner seat first, before any other placement
  const hasFixedStudent = students.some(s => s.id === FIXED_SEAT_STUDENT_ID);
  if(hasFixedStudent){
    grid[FIXED_SEAT[0]][FIXED_SEAT[1]] = FIXED_SEAT_STUDENT_ID;
    const idx = frontSeats.findIndex(([r,c]) => r===FIXED_SEAT[0] && c===FIXED_SEAT[1]);
    if(idx !== -1){ frontSeats.splice(idx,1); }
  }

  const pool = students.filter(s => s.id !== FIXED_SEAT_STUDENT_ID);
  const frontPref = shuffle(pool.filter(s=>s.pref==='front').map(s=>s.id));
  const backPref  = shuffle(pool.filter(s=>s.pref==='back').map(s=>s.id));
  const none      = shuffle(pool.filter(s=>s.pref==='none').map(s=>s.id));

  let overflow = [];
  const frontCap = 16 - (hasFixedStudent ? 1 : 0);

  // place front-preferring students into front seats
  const frontPlaced = frontPref.slice(0,frontCap);
  overflow = overflow.concat(frontPref.slice(frontCap));
  const frontShuffledSeats = shuffle(frontSeats);
  frontPlaced.forEach((id,i) => { const [r,c]=frontShuffledSeats[i]; grid[r][c]=id; });
  const leftoverFrontSeats = frontShuffledSeats.slice(frontPlaced.length);

  // place back-preferring students into back seats (cap 8)
  const backPlaced = backPref.slice(0,8);
  overflow = overflow.concat(backPref.slice(8));
  const backShuffledSeats = shuffle(backSeats);
  backPlaced.forEach((id,i) => { const [r,c]=backShuffledSeats[i]; grid[r][c]=id; });
  const leftoverBackSeats = backShuffledSeats.slice(backPlaced.length);

  // remaining pool: none students + overflow, fill remaining seats (mid + leftovers)
  const remainingSeats = shuffle([...midSeats, ...leftoverFrontSeats, ...leftoverBackSeats]);
  const remainingStudents = shuffle([...none, ...overflow]);
  remainingStudents.forEach((id,i) => {
    if(i < remainingSeats.length){ const [r,c]=remainingSeats[i]; grid[r][c]=id; }
  });

  return grid;
}

function randomizeSeats(){
  if(students.length === 0){ alert('먼저 학생을 등록해 주세요.'); return; }
  if(students.length > 32){ alert('학생 수가 32명을 초과했습니다.'); return; }

  let best = null, bestConflicts = Infinity;
  const attempts = 250;
  for(let i=0;i<attempts;i++){
    const g = buildAttempt();
    const c = countConflicts(g);
    if(c < bestConflicts){ best = g; bestConflicts = c; }
    if(bestConflicts === 0) break;
  }
  seats = best;
  selectedSeat = null;
  renderSeatGrid();

  const bannerArea = document.getElementById('bannerArea');
  if(bestConflicts === 0){
    bannerArea.innerHTML = `<div class="banner banner-ok">✅ 선호와 기피 조건을 모두 만족하는 자리 배치를 완성했습니다.</div>`;
  } else {
    bannerArea.innerHTML = `<div class="banner banner-warn">⚠️ 기피 조건이 너무 많아 ${bestConflicts}건은 완전히 피하지 못했습니다. 자리를 클릭해 수동으로 바꿔 주세요. (충돌 자리는 빨간색으로 표시)</div>`;
  }
}

// ---------- rendering ----------
function studentById(id){ return students.find(s=>s.id===id); }

function renderSeatGrid(){
  const rowsOrder = mode === 'screen' ? [0,1,2,3] : [3,2,1,0];
  const colsOrder = mode === 'screen' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

  const gridEl = document.getElementById('seatGrid');
  let html = '';
  rowsOrder.forEach(r => {
    html += '<div class="seat-row">';
    // group displayed cols into pairs of 2 for visual grouping
    for(let i=0;i<8;i+=2){
      const c1 = colsOrder[i], c2 = colsOrder[i+1];
      html += '<div class="pair-group">';
      html += seatCellHtml(r, c1);
      html += seatCellHtml(r, c2);
      html += '</div>';
    }
    html += '</div>';
  });
  gridEl.innerHTML = html;

  document.getElementById('leftLabel').className = 'side-label ' + (mode==='screen' ? 'side-window' : 'side-corridor');
  document.getElementById('leftLabel').textContent = mode==='screen' ? '창가' : '복도';
  document.getElementById('rightLabel').className = 'side-label ' + (mode==='screen' ? 'side-corridor' : 'side-window');
  document.getElementById('rightLabel').textContent = mode==='screen' ? '복도' : '창가';

  document.getElementById('podiumTop').style.display = mode==='screen' ? 'block' : 'none';
  document.getElementById('podiumBottom').style.display = mode==='screen' ? 'none' : 'block';
}

function seatCellHtml(r, c){
  const id = seats[r][c];
  const student = id ? studentById(id) : null;
  const isConflict = id ? checkSeatConflict(r,c) : false;
  const isSelected = selectedSeat && selectedSeat.row===r && selectedSeat.col===c;
  const classes = ['seat'];
  if(!student) classes.push('empty');
  if(isConflict) classes.push('conflict');
  if(isSelected) classes.push('selected');
  return `<div class="${classes.join(' ')}" onclick="onSeatClick(${r},${c})">${student ? escapeHtml(student.name) + '<br><span class="seat-id">' + student.id + '</span>' : '빈자리'}</div>`;
}

function checkSeatConflict(r,c){
  const groups = pairGroupsForRow();
  const group = groups.find(g => g.includes(c));
  const [c1,c2] = group;
  const a = seats[r][c1], b = seats[r][c2];
  if(!a || !b) return false;
  return forbiddenPairs.some(p => (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
}

function isSwapAllowed(r1,c1,r2,c2){
  const idAt1 = seats[r1][c1];
  const idAt2 = seats[r2][c2];
  const isFixedSeat = (r,c) => r===FIXED_SEAT[0] && c===FIXED_SEAT[1];
  const isNearSeat = (r,c) => NEAR_FIXED_SEAT.some(([nr,nc]) => nr===r && nc===c);

  // the fixed-seat student may never be moved off her seat
  if(idAt1===FIXED_SEAT_STUDENT_ID && !isFixedSeat(r2,c2)) return false;
  if(idAt2===FIXED_SEAT_STUDENT_ID && !isFixedSeat(r1,c1)) return false;
  // only the fixed-seat student may occupy the fixed seat
  if(isFixedSeat(r1,c1) && idAt2 && idAt2!==FIXED_SEAT_STUDENT_ID) return false;
  if(isFixedSeat(r2,c2) && idAt1 && idAt1!==FIXED_SEAT_STUDENT_ID) return false;
  // keep-away students may never land in a seat adjacent to the fixed seat
  if(isNearSeat(r1,c1) && idAt2 && KEEP_AWAY_IDS.includes(idAt2)) return false;
  if(isNearSeat(r2,c2) && idAt1 && KEEP_AWAY_IDS.includes(idAt1)) return false;
  return true;
}

function findSeatOf(studentId){
  for(let r=0;r<4;r++){
    for(let c=0;c<8;c++){
      if(seats[r][c] === studentId){ return {r,c}; }
    }
  }
  return null;
}

function onSeatClick(r,c){
  if(!selectedSeat){
    selectedSeat = {row:r, col:c};
  } else if(selectedSeat.row===r && selectedSeat.col===c){
    selectedSeat = null;
  } else {
    if(isSwapAllowed(selectedSeat.row, selectedSeat.col, r, c)){
      const tmp = seats[r][c];
      seats[r][c] = seats[selectedSeat.row][selectedSeat.col];
      seats[selectedSeat.row][selectedSeat.col] = tmp;
    }
    selectedSeat = null;
  }
  renderSeatGrid();
}

function toggleMode(){
  mode = mode === 'screen' ? 'print' : 'screen';
  document.getElementById('modeBtn').textContent = mode === 'screen' ? '🖥 학생 이동용 화면 보기' : '🖨 교탁용 자리표 보기';
  renderSeatGrid();
}

function printChart(){
  const prevMode = mode;
  mode = 'print';
  document.getElementById('modeBtn').textContent = '🖨 교탁용 자리표 보기';
  renderSeatGrid();
  setTimeout(() => {
    window.print();
    mode = prevMode;
    document.getElementById('modeBtn').textContent = mode === 'screen' ? '🖥 학생 이동용 화면 보기' : '🖨 교탁용 자리표 보기';
    renderSeatGrid();
  }, 100);
}

// ---------- init ----------
renderStudentList();
renderForbiddenSelects();
renderForbiddenList();
renderSeatGrid();
</script>
